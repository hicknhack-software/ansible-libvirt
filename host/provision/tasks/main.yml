---
- name: Install packages
  ansible.builtin.apt:
    pkg: "{{ libvirt_host_packages | list }}"
    update_cache: true
    state: latest
    cache_valid_time: 86400

- name: Machine hooks folder
  ansible.builtin.file:
    dest: "{{ libvirt_host_qemu_machine_hooks_folder }}"
    state: directory
    mode: "755"

- name: Qemu hook
  ansible.builtin.template:
    dest: "{{ libvirt_host_qemu_hook }}"
    src: "qemu_hook.j2"
    mode: "700"
  notify: Restart libvirt

- name: Increase semaphore count
  ansible.builtin.template:
    dest: "/etc/sysctl.d/local.conf"
    src: "sysctl_local.conf.j2"
    mode: "644"

- name: Disable audit
  ansible.builtin.lineinfile:
    dest: "/etc/libvirt/libvirtd.conf"
    regexp: "^audit_level"
    line: "audit_level = 0"
  notify: Restart libvirt

- name: Network hook
  ansible.builtin.template:
    dest: "{{ network_interface_up_hooks_path }}/libvirt"
    src: "if_up_libvirt.sh.j2"
    mode: "700"
  register: libvirt_provision_network_hook_result

- name: Initially run network hook
  ansible.builtin.command: "{{ network_interface_up_hooks_path }}/libvirt"
  changed_when: true
  when: libvirt_provision_network_hook_result.changed and true
