---
- name: Install packages
  ansible.builtin.apt:
    pkg:
      - resolvconf
    update_cache: true
    state: latest
    cache_valid_time: 86400

- name: Create directory
  ansible.builtin.file:
    path: "{{ libvirt_bridge_path }}"
    state: directory
    mode: "755"

- name: Create config
  ansible.builtin.template:
    src: config.xml.j2
    dest: "{{ libvirt_bridge_path }}/{{ item.name }}.xml"
    mode: "644"
  loop: "{{ libvirt_bridges | list }}"
  register: configure_result

- name: Check states
  ansible.builtin.command: virsh net-info {{ item.item.name }}
  failed_when: false
  changed_when: false
  register: check_states_result
  loop: "{{ configure_result.results | flatten(levels=1) }}"

- name: Stop and undefine existing
  ansible.builtin.shell: >
    virsh net-destroy {{ item[0].item.name }};
    virsh net-undefine {{ item[0].item.name }}
  when: (item[1].rc == 0) and (item[0].changed)
  changed_when: true
  loop: "{{ configure_result.results | flatten(levels=1) | zip(check_states_result.results | flatten(levels=1)) | list }}"

- name: Define and start
  ansible.builtin.shell: >
    virsh net-define {{ libvirt_bridge_path }}/{{ item.item.name }}.xml &&
    virsh net-autostart {{ item.item.name }} &&
    virsh net-start {{ item.item.name }}
  changed_when: true
  when: item.changed and true

  loop: "{{ configure_result.results | flatten(levels=1) }}"

- name: Check for Openresolv config
  ansible.builtin.stat:
    path: "{{ libvirt_qemu_resolv_conf_head }}"
  register: openresolv

- name: Configure DNS with Openresolv
  when: openresolv.stat.isreg is defined and openresolv.stat.isreg
  block:
    - name: Add dnsmasq to resolve
      ansible.builtin.lineinfile:
        dest: "{{ libvirt_qemu_resolv_conf_head }}"
        regexp: "^nameserver"
        line: "nameserver {{ (libvirt_bridges | first).ip_address }}"
      register: nameserver_result

    - name: Call resolvconf
      ansible.builtin.command: "resolvconf -u"
      changed_when: true
      when: nameserver_result.changed and true

- name: Check for Systemd Resolver config
  ansible.builtin.stat:
    path: "{{ libvirt_systemd_resolved_conf }}"
  register: systemdresolve

- name: Configure dns with systemd Resolver
  when: systemdresolve.stat.isreg is defined and systemdresolve.stat.isreg
  block:
    - name: Generate reslove.d folder
      ansible.builtin.file:
        path: "{{ libvirt_systemd_resolved_d_dir }}"
        state: directory
        mode: "755"

    - name: Add dnsmasq to resolved entry
      ansible.builtin.copy:
        content: |
          [Resolve]
          DNS={{ (libvirt_bridges | first).ip_address }}
          Domains={{ (libvirt_bridges | first).domain | default('', true) }}
        dest: "{{ libvirt_systemd_resolved_d_dir }}/qemu_dnsmasq.conf"
        mode: "644"
      register: nameserver_result

    - name: Restart systemd resvolver
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
      when: nameserver_result.changed and true
